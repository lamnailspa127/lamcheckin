<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>LAM CHECK IN</title>

  <!-- Home Screen / PWA support -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="LAM Check In">
  <link rel="apple-touch-icon" href="/logo.png">
  <link rel="icon" type="image/png" href="/logo.png">

  <style>
    :root {
      --bg: #ffffff; --text: #0a0a0a; --muted: #6b6b6b; --border: #e8e8e8;
      --accent: #111111; --success: #0d9488; --key-bg: #f4f4f4; --key-active: #e0e0e0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      min-height: 100%;
    }
    body {
      font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100dvh;
      display: flex; flex-direction: column; align-items: center;
      padding: 12px 16px 24px;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .logo {
      width: 88px;
      height: auto;
      margin-bottom: 8px;
      flex-shrink: 0;
    }
    h1 {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 2px;
      flex-shrink: 0;
    }
    .subtitle {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 12px;
      flex-shrink: 0;
    }
    .phone-display {
      width: 100%; max-width: 320px;
      background: #fafafa; border: 1px solid var(--border);
      border-radius: 12px; padding: 12px 16px;
      font-size: 22px; font-weight: 500; letter-spacing: 2px;
      text-align: center; min-height: 52px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 12px; font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }
    .phone-display.empty { color: #ccc; letter-spacing: 1px; font-size: 16px; }
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: 100%;
      max-width: 320px;
      margin-bottom: 12px;
      flex-shrink: 0;
    }
    .key {
      aspect-ratio: 1.55;
      background: var(--key-bg);
      border: none;
      border-radius: 12px;
      font-size: 22px;
      font-weight: 500;
      color: var(--text);
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      display: flex; align-items: center; justify-content: center;
      user-select: none;
    }
    .key:active { background: var(--key-active); transform: scale(0.96); }
    .key.action { font-size: 13px; font-weight: 600; }
    .key.clear { background: #f0f0f0; color: #666; }
    .actions {
      width: 100%;
      max-width: 320px;
      flex-shrink: 0;
    }
    button.primary {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.3px;
      border: none;
      border-radius: 12px;
      background: var(--accent);
      color: white;
      cursor: pointer;
    }
    button.primary:active { transform: scale(0.98); }
    button.primary:disabled { opacity: 0.35; cursor: not-allowed; }
    button.secondary {
      width: 100%;
      margin-top: 8px;
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.3px;
      border: 1.5px solid #111;
      border-radius: 12px;
      background: #fff;
      color: #111;
      cursor: pointer;
    }
    button.secondary:active {
      transform: scale(0.98);
      background: #f5f5f5;
    }
    #result {
      width: 100%;
      max-width: 320px;
      margin-top: 8px;
      display: none;
    }
    #result.visible { display: block; }
    #searchUI.hidden { display: none !important; }
    .new-search-btn {
      width: 100%;
      max-width: 320px;
      margin-bottom: 12px;
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
      border: 1.5px solid #111;
      border-radius: 12px;
      background: #fff;
      color: #111;
      cursor: pointer;
      display: none;
    }
    .new-search-btn.show { display: block; }
    .card button.primary { margin-top: 12px; }
    .card {
      background: #fafafa;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
    }
    .card h3 { font-size: 17px; margin-bottom: 6px; }
    .detail { font-size: 13px; color: var(--muted); margin: 3px 0; }
    .detail span { color: var(--text); font-weight: 500; }
    .badge {
      display: inline-block;
      margin-top: 8px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      background: #d1fae5;
      color: #065f46;
    }
    .badge.waiting { background: #f3f4f6; color: #374151; }
    .message {
      width: 100%; max-width: 320px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 14px;
      margin-bottom: 8px;
      display: none;
      flex-shrink: 0;
    }
    .message.show { display: block; }
    .message.success { background: #d1fae5; color: #065f46; }
    .message.error { background: #fee2e2; color: #991b1b; }
    footer {
      margin-top: 8px;
      font-size: 11px;
      color: #bbb;
      flex-shrink: 0;
    }
    body.loading { opacity: 0.85; pointer-events: none; }

    /* Slightly roomier on iPad / larger screens */
    @media (min-height: 800px) {
      .logo { width: 110px; margin-bottom: 12px; }
      h1 { font-size: 22px; }
      .subtitle { margin-bottom: 16px; font-size: 14px; }
      .phone-display { padding: 16px; font-size: 26px; min-height: 60px; margin-bottom: 16px; }
      .keypad { gap: 10px; margin-bottom: 16px; }
      .key { font-size: 24px; }
      button.primary { padding: 16px; font-size: 16px; }
      body { padding: 20px 20px 24px; }
    }
  </style>
</head>
<body>
  <img src="/logo.png" alt="LAM Nail Spa" class="logo" />
  <h1>LAM CHECK IN</h1>
  <p class="subtitle">Enter your phone number</p>

  <button type="button" class="new-search-btn" id="newSearchBtn" onclick="resetSearch()">← New Search</button>

  <div id="searchUI">

  <div class="phone-display empty" id="display">Phone number</div>

  <div class="keypad" id="keypad">
    <button class="key" data-key="1">1</button>
    <button class="key" data-key="2">2</button>
    <button class="key" data-key="3">3</button>
    <button class="key" data-key="4">4</button>
    <button class="key" data-key="5">5</button>
    <button class="key" data-key="6">6</button>
    <button class="key" data-key="7">7</button>
    <button class="key" data-key="8">8</button>
    <button class="key" data-key="9">9</button>
    <button class="key clear action" data-key="clear">Clear</button>
    <button class="key" data-key="0">0</button>
    <button class="key action" data-key="back">⌫</button>
  </div>

  <div class="actions">
    <button class="primary" id="lookupBtn" onclick="lookup()" disabled>Find Appointment</button>
    <button class="secondary" onclick="window.open('https://book.squareup.com/appointments/ugb6nlboeff7si/location/L5NJSKPJF80C0/services', '_blank')">
      Book an Appointment
    </button>
  </div>
  </div><!-- /searchUI -->

  <div class="message" id="message"></div>
  <div class="result" id="result"></div>
  <footer>LAM Nail Spa · Est. 2023</footer>


  <script>
    const BOOKING_URL = "https://book.squareup.com/appointments/ugb6nlboeff7si/location/L5NJSKPJF80C0/services";
    let phone = "";
    const display = document.getElementById("display");
    const lookupBtn = document.getElementById("lookupBtn");
    const resultEl = document.getElementById("result");
    const messageEl = document.getElementById("message");
    const bodyEl = document.body;
    const searchUI = document.getElementById("searchUI");
    const newSearchBtn = document.getElementById("newSearchBtn");

    function resetSearch() {
      if (searchUI) searchUI.classList.remove("hidden");
      if (newSearchBtn) newSearchBtn.classList.remove("show");
      resultEl.classList.remove("visible");
      resultEl.innerHTML = "";
      clearMessage();
      phone = "";
      renderPhone();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }


    document.getElementById("keypad").addEventListener("click", (e) => {
      const key = e.target.closest(".key")?.dataset.key;
      if (!key) return;
      if (key === "clear") phone = "";
      else if (key === "back") phone = phone.slice(0, -1);
      else if (phone.length < 10) phone += key;
      updateDisplay();
    });

    function updateDisplay() {
      if (!phone) {
        display.textContent = "Phone number";
        display.classList.add("empty");
        lookupBtn.disabled = true;
      } else {
        let formatted = phone;
        if (phone.length > 6) formatted = `(${phone.slice(0,3)}) ${phone.slice(3,6)}-${phone.slice(6)}`;
        else if (phone.length > 3) formatted = `(${phone.slice(0,3)}) ${phone.slice(3)}`;
        display.textContent = formatted;
        display.classList.remove("empty");
        lookupBtn.disabled = phone.length < 10;
      }
    }

    function showMessage(text, type) {
      messageEl.textContent = text;
      messageEl.className = "message " + type;
    }
    function clearMessage() {
      messageEl.className = "message";
      messageEl.textContent = "";
    }

    function formatTime(iso) {
      return new Date(iso).toLocaleTimeString("en-US", {
        timeZone: "America/Toronto",
        hour: "numeric",
        minute: "2-digit",
      });
    }

    async function lookup() {
      if (phone.length < 10) return;
      clearMessage();
      bodyEl.classList.add("loading");
      lookupBtn.textContent = "Searching…";
      resultEl.classList.remove("visible");
      resultEl.innerHTML = "";

      try {
        // Search today's appointments by phone across ALL customer profiles
        const bookRes = await fetch("/api/get-todays-bookings", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ phone: phone }),
        });
        const bookData = await bookRes.json();
        if (!bookRes.ok) throw new Error(bookData.error?.detail || bookData.error || "Could not load bookings");

        const bookings = bookData.bookings || [];

        if (bookings.length === 0) {
          const profiles = bookData.profilesFound || [];
          let profileNote = "";
          if (profiles.length > 0) {
            profileNote = "<p class=\"detail\" style=\"margin-top:8px\">Profiles found: " +
              profiles.map(p => p.name).join(", ") +
              "</p><p class=\"detail\">None of these profiles have an appointment today.</p>";
          }
          resultEl.innerHTML = `
            <div class="card">
              <h3>No appointment found</h3>
              <p class="detail">We couldn’t find a booking for this number today.</p>
              ${profileNote}
              <button class="primary" style="margin-top:18px" onclick="window.open('${BOOKING_URL}', '_blank')">
                Book an Appointment
              </button>
            </div>`;
          resultEl.classList.add("visible");
          return;
        }

        bookings.sort((a, b) => new Date(a.start_at) - new Date(b.start_at));

        let html = "";
        bookings.forEach((b) => {
          const time = formatTime(b.start_at);
          const checkedIn = b.checkedIn;
          const guest = b.guestName || "Guest";
          html += `
            <div class="card">
              <h3>${time}</h3>
              <p class="detail"><span>Service:</span> ${b.serviceName || "Service"}</p>
              <p class="detail"><span>Nail Tech:</span> ${b.staffName || "Staff"}</p>
              <p class="detail"><span>Guest:</span> ${guest}</p>
              <span class="badge ${checkedIn ? "" : "waiting"}">${checkedIn ? "Checked in" : "Ready to check in"}</span>
              ${!checkedIn ? `<button class="primary" style="margin-top:16px" onclick="checkIn('${b.id}', ${b.version || 0})">Check In Now</button>` : ""}
            </div>`;
        });
        resultEl.innerHTML = html;
        resultEl.classList.add("visible");
        if (searchUI) searchUI.classList.add("hidden");
        if (newSearchBtn) newSearchBtn.classList.add("show");
        window.scrollTo({ top: 0, behavior: "smooth" });
      } catch (err) {
        showMessage(err.message || "Something went wrong", "error");
      } finally {
        bodyEl.classList.remove("loading");
        lookupBtn.textContent = "Find Appointment";
      }
    }

    async function checkIn(bookingId, version) {
      clearMessage();
      bodyEl.classList.add("loading");
      try {
        const res = await fetch("/api/check-in", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ bookingId, version }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error?.detail || data.error || "Check-in failed");
        showMessage("You're checked in. We'll be with you shortly.", "success");
        setTimeout(lookup, 900);
      } catch (err) {
        showMessage(err.message || "Check-in failed", "error");
      } finally {
        bodyEl.classList.remove("loading");
      }
    }
  </script>
</body>
</html>
